<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradient -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="offset" values="-1;1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="offset" values="0;2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="offset" values="1;3" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 🔥 COMBINED MASK -->
    <mask id="mask">

      <!-- Alles sichtbar -->
      <rect x="0" y="0" width="900" height="220" rx="30" fill="white"/>

      <!-- Wave wird "ausgeschnitten" -->
      <path fill="black"
        d="M-2,155 C250,110 650,210 902,155 L902,222 L-2,222 Z">
        <animate attributeName="d"
          dur="5s"
          repeatCount="indefinite"
          values="
            M-2,155 C250,110 650,210 902,155 L902,222 L-2,222 Z;
            M-2,175 C300,140 600,190 902,145 L902,222 L-2,222 Z;
            M-2,155 C250,110 650,210 902,155 L902,222 L-2,222 Z
          " />
      </path>

    </mask>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background mit ausgeschnittener Wave -->
  <rect x="0" y="0" width="900" height="220"
        rx="30"
        fill="url(#gradient)"
        mask="url(#mask)" />

  <!-- Optional: darunter dunkle Fläche (wie dein Screenshot) -->
  <rect x="0" y="150" width="900" height="70"
        fill="#020617" rx="0"/>

  <!-- Title -->
  <text x="50%" y="40%" text-anchor="middle"
        font-size="66"
        font-weight="800"
        fill="#ffffff"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
    Astra
  </text>

  <!-- Subtitle -->
  <text x="50%" y="155" text-anchor="middle"
        font-size="18"
        font-weight="600"
        fill="#e0e7ff"
        font-family="Inter, Segoe UI, sans-serif"
        letter-spacing="3">
    <tspan>
      <animate attributeName="fill"
        values="#a5b4fc;#ffffff;#a5b4fc"
        dur="3s"
        repeatCount="indefinite"/>
      NEXT-GEN DISCORD AUTOMATION
    </tspan>
  </text>

</svg>