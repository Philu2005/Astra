<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 🔥 Animated Gradient -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- 🔥 MASK (WAVE TIEFER = MEHR GRADIENT OBEN) -->
    <mask id="mask">
      <rect width="900" height="220" rx="30" fill="white"/>

      <path fill="black"
        d="M-2,185 C250,140 650,240 902,185 L902,222 L-2,222 Z">
        <animate attributeName="d"
          dur="5s"
          repeatCount="indefinite"
          values="
            M-2,185 C250,140 650,240 902,185 L902,222 L-2,222 Z;
            M-2,205 C300,170 600,220 902,175 L902,222 L-2,222 Z;
            M-2,185 C250,140 650,240 902,185 L902,222 L-2,222 Z
          " />
      </path>
    </mask>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="900" height="220"
        fill="url(#gradient)"
        mask="url(#mask)"
        rx="30"/>

  <!-- Secondary Wave (AUCH TIEFER ANGEPASST) -->
  <path fill="#020617" opacity="0.22"
    mask="url(#mask)"
    d="M-2,180 C200,140 720,240 902,180 L902,222 L-2,222 Z">
    <animate attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
        M-2,180 C200,140 720,240 902,180 L902,222 L-2,222 Z;
        M-2,200 C260,170 650,220 902,185 L902,222 L-2,222 Z;
        M-2,180 C200,140 720,240 902,180 L902,222 L-2,222 Z
      " />
  </path>

  <!-- Accent Line -->
  <rect x="350" y="125" width="200" height="2"
        fill="#ffffff" opacity="0.4">
    <animate attributeName="opacity"
      values="0.2;0.6;0.2"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Title -->
  <text x="50%" y="40%" text-anchor="middle"
        font-size="66"
        font-weight="800"
        fill="#ffffff"
        font-family="Segoe UI, Inter, Arial"
        filter="url(#glow)">
    <animate attributeName="opacity"
      values="1;0.85;1"
      dur="2s"
      repeatCount="indefinite"/>
    Astra
  </text>

  <!-- Subtitle -->
  <text x="50%" y="155" text-anchor="middle"
        font-size="18"
        font-weight="600"
        fill="#e0e7ff"
        font-family="Inter, Segoe UI, sans-serif"
        letter-spacing="3">
    <tspan>
      <animate attributeName="fill"
        values="#a5b4fc;#ffffff;#a5b4fc"
        dur="3s"
        repeatCount="indefinite"/>
      NEXT-GEN DISCORD AUTOMATION
    </tspan>
  </text>

</svg>